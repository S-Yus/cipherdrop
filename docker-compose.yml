# 使い方: docker compose up -d --build
#
#   web : 画面の配信と /api/ の転送（nginx）。ホストの 127.0.0.1:8080 にだけ公開する（外部からは直接届かない）
#   api : API サーバー。compose の内部ネットワークにだけ置き、web からしか届かない
#
# 外部公開は同じホスト上の cloudflared（Cloudflare Tunnel）が http://localhost:8080 へ転送して行う。
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: cipherdrop-api:latest
    container_name: cipherdrop-api
    environment:
      # アプリにはトンネル（cloudflared）→ web 経由でしか届かないので、Cloudflare が付ける実 IP ヘッダーを信頼してよい。
      # レート制限を IP ごとに数えるために使う（未対応の版では無視される）。
      - CLIENT_IP_HEADER=cf-connecting-ip

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: cipherdrop-web:latest
    container_name: cipherdrop-web
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy

  # 任意: cloudflared もこの compose で管理する場合だけ使う。
  #   1) .env に TUNNEL_TOKEN=... を書く（.env はコミットしない）
  #   2) 既存の cloudflared コンテナを止めてから: docker compose --profile tunnel up -d
  # network_mode: host なので、トンネル側の転送先 localhost:8080 がホストの 8080 を指す。
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - web
