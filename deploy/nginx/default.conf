# CipherDrop の Web 配信（静的な画面）と API へのリバースプロキシ。
# 前段の Cloudflare Tunnel から http://localhost:8080 で届く。TLS は Cloudflare で終端する。

# ログに URL を出さない（/v/{id} や /api/payload/{id} の ID を残さない）。IP も記録しない。
log_format cipherdrop '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout cipherdrop;

    root /usr/share/nginx/html;
    charset utf-8;

    # 暗号文の上限は 10 MiB（API 側でも検査する）
    client_max_body_size 11m;

    # 送信・受信の画面（どちらも同じ index.html。表示の切り替えはブラウザ側で行う）
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~ "^/v/[A-Za-z0-9_-]{22}$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # GET は「取得＝削除」なので、失敗しても別の上流へ再送しない（再送すると受信者は 404 になる）
        proxy_next_upstream off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 暗号文をディスクに一時保存しない
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
}
