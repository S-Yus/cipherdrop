# フロントエンド配信のレスポンスすべてに付ける、エンタープライズ基準のセキュリティヘッダー。
# nginx.conf の各 location から `include` する。/api/ には含めない
# （バックエンド自身が同等以上のヘッダーを付けて返す。apps/backend/src/server.ts の BASE_HEADERS）。
#
# CSP は apps/frontend/vite.config.ts が本番ビルドの index.html に埋め込む <meta> と同じ内容に
# frame-ancestors を足したもの。<meta> では frame-ancestors が効かないため、ここが最終的な強制点になる
# （tests/build-output.test.ts が <meta> の中身を、tests/infra.test.ts がこのファイルとの整合を検査する）。
#
# HSTS の "preload" は、このヘッダーを送るだけでは有効にならない。実際に preload リストへ登録するには
# 運用者が https://hstspreload.org/ でドメインを申請する必要がある（一度登録するとブラウザ側の解除は困難）。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
