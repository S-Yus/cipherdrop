# CipherDrop の配信設定。
#   / (静的)   apps/frontend/dist を配信する（SPA フォールバック: /v/:id のような実在しないパスも index.html）
#   /api/      同一コンテナ内のバックエンド（127.0.0.1:8787、node:http のみ）へそのまま中継する
#
# 非 root ユーザー（Dockerfile の USER node、uid 1000）で動かすため、80 番ではなく 8080 番で待ち受け、
# PID・一時ファイルはすべて世界書き込み可能な /tmp 配下に置く。これは nginx 公式の非 root 用イメージ
# （github.com/nginx/docker-nginx-unprivileged）と同じ構成に倣っている。

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 安全なアクセスログ。既定の combined 形式は $request（例: "GET /api/payload/{id}/consume HTTP/1.1"）を
  # そのまま記録するため、ペイロード ID・クエリ文字列がログに残ってしまう。CipherDrop は ID すら
  # 第三者に不必要に見せたくない（README「信頼モデル」参照）ので、URI・クエリを含まない形式にする
  # （バックエンド自身の構造化ログ = server.ts の LogEvent が、同じ理由で URL・ID を持たないのと同じ方針）。
  # メソッド・ステータス・応答時間などの運用に必要な最小限の情報だけは残す。
  log_format cipherdrop_safe
    '$remote_addr [$time_local] "$request_method $server_protocol" $status $body_bytes_sent ${request_time}s';
  # コンテナのログは標準出力・標準エラーへ（`docker logs` / `docker compose logs` で見る）。
  access_log /dev/stdout cipherdrop_safe;
  error_log /dev/stderr warn;

  # 非 root では既定の /var/cache/nginx 等に書き込めないので、すべて /tmp 配下にする。
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off; # nginx のバージョンをレスポンスヘッダーで漏らさない

  # Slowloris 等、ヘッダー・本文を極端に低速で送る接続によるワーカー占有を防ぐ。一定時間データの
  # やり取りが無ければ切断する（client_header_timeout はヘッダー受信、client_body_timeout は本文受信、
  # send_timeout は応答送信のそれぞれに対する、個々の読み書き間のタイムアウト）。
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;

  # IP 単位の同時接続数・リクエスト頻度を制限するためのゾーン（DoS 対策）。10m はゾーンが保持できる
  # 追跡対象 IP 数の目安であり、接続数・リクエスト数そのものの上限ではない（実際の上限は下の
  # limit_conn / limit_req の引数）。429 Too Many Requests が意味的に正しいステータス（既定は 503）。
  limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
  limit_req_zone $binary_remote_addr zone=perip_req:10m rate=10r/s;
  limit_req_status 429;

  # バックエンドの上限（10 MiB、apps/backend/src/server.ts の DEFAULT_MAX_PAYLOAD_BYTES）に
  # わずかな余裕を足した値。これを超える本文はここで 413 になる。
  client_max_body_size 11m;

  server {
    listen 8080;
    server_name _;
    root /app/frontend;
    index index.html;

    # IP 単位で同時接続数・リクエスト頻度を制限する（DoS 対策。上の limit_conn_zone / limit_req_zone 参照）。
    # burst はゾーンの余裕分で、ページ読み込み時の並行リソース取得のような短い突発的なアクセスまでは
    # 弾かないための遊び（nodelay: 遊びの範囲内なら遅延させず、超えた分だけ即座に 429 にする）。
    limit_conn perip_conn 20;
    limit_req zone=perip_req burst=20 nodelay;

    # /api/ はバックエンドへそのまま中継する。ヘッダーはバックエンド自身が付けるので、ここでは
    # 追加しない（二重に付けて、内容の異なる同名ヘッダーが 2 つ届くような食い違いを起こさない）。
    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      # 消費 API（POST .../consume）は 2 回目以降 404 になる仕様。再送すると誤って失敗と誤認しうるため、
      # 上流ごと変えての再試行はしない（README「配信（デプロイ）の要件」参照）。
      proxy_next_upstream off;
    }

    # ハッシュ付きの静的資産（Vite がファイル名にハッシュを含める）は長期キャッシュしてよい。
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # SPA のエントリーポイントは毎回検証する（デプロイの差し替えを即時反映するため、キャッシュしない）。
    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # /v/:id のような実在しないパスも index.html にフォールバックする（クライアントサイドルーティング）。
    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
